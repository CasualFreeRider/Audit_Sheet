<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Field Audit</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#12181F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Field Audit">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --paper:#E7EBEF;
  --surface:#FFFFFF;
  --ink:#12181F;
  --muted:#5F6873;
  --line:#C6CDD5;
  --line-soft:#DDE3E8;
  --red:#C8102E;
  --red-soft:#FBEAEC;
  --amber:#B47100;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.45;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));
  overscroll-behavior-y:contain;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}

/* ---------- Title block: the persistent drawing-sheet header ---------- */
.titleblock{
  position:sticky;top:0;z-index:40;
  background:var(--surface);
  border-bottom:2px solid var(--red);
  padding:calc(8px + env(safe-area-inset-top)) 14px 0;
}
.tb-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.tb-name{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.tb-count{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--muted)}
.tb-count b{color:var(--ink)}
.tb-grid{display:grid;grid-template-columns:1fr 1fr 1fr;margin-top:6px}
.tb-cell{padding:4px 8px 8px 0;min-width:0}
.tb-cell+.tb-cell{border-left:1px solid var(--line-soft);padding-left:10px}
.tb-label{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);display:block}
.tb-value{font-family:var(--mono);font-size:15px;font-weight:700;letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;margin-top:2px}
.tb-value.empty{color:var(--line);font-weight:500}

/* ---------- Tabs ---------- */
.tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--line)}
.tab{flex:1;appearance:none;background:none;border:0;padding:13px 4px 11px;
  font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);border-bottom:3px solid transparent;cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--red);font-weight:700}

main{padding:14px 14px 0}
.panel[hidden]{display:none}

/* ---------- Fields ---------- */
.field{margin-bottom:14px}
.flabel{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);display:block;margin-bottom:5px}
.ctl{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:2px;
  padding:13px 12px;min-height:50px;font-family:var(--mono);font-size:16px}
textarea.ctl{font-family:var(--sans);min-height:78px;resize:vertical;line-height:1.4}
select.ctl{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);
  background-position:calc(100% - 19px) 22px,calc(100% - 13px) 22px;background-size:6px 6px,6px 6px;background-repeat:no-repeat;padding-right:38px}
.row{display:flex;gap:8px;align-items:stretch}
.row .ctl{flex:1;min-width:0}
.iconbtn{flex:0 0 50px;background:var(--surface);border:1px solid var(--line);border-radius:2px;
  font-size:24px;line-height:1;color:var(--red);cursor:pointer;font-weight:400}
.iconbtn:active{background:var(--red-soft)}
.addrow{display:flex;gap:8px;margin-top:8px}
.addrow[hidden]{display:none}
.addrow .ctl{flex:1}
.mini{background:var(--ink);color:#fff;border:0;border-radius:2px;padding:0 16px;
  font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.mini.ghost{background:none;color:var(--muted);border:1px solid var(--line)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ---------- Photos ---------- */
.photobar{display:flex;gap:8px}
.photobar .mini{flex:1;padding:14px 0;background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.thumb{position:relative;width:72px;height:72px;border:1px solid var(--line);border-radius:2px;overflow:hidden;background:#000}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:0;right:0;width:26px;height:26px;border:0;background:var(--ink);
  color:#fff;font-size:15px;line-height:26px;padding:0;cursor:pointer}

/* ---------- Save bar ---------- */
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--surface);
  border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  display:flex;gap:10px;align-items:center}
.save{flex:1;background:var(--red);color:#fff;border:0;border-radius:2px;padding:16px;
  font-family:var(--mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;cursor:pointer}
.save:disabled{background:var(--line);color:#fff}
.keep{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.keep input{width:22px;height:22px;accent-color:var(--red)}

/* ---------- Entries ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:11px 12px;margin-bottom:9px}
.card-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.card-id{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--red);font-weight:700}
.card-time{font-family:var(--mono);font-size:10px;color:var(--muted)}
.card-loc{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:5px;letter-spacing:.02em}
.card-asset{font-size:16px;font-weight:600;margin-top:3px;line-height:1.3}
.card-meta{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:4px}
.card-notes{font-size:14px;color:var(--muted);margin-top:5px;white-space:pre-wrap}
.card-acts{display:flex;gap:8px;margin-top:10px}
.card-acts .mini{flex:1;padding:9px 0;text-align:center}
.empty-state{background:var(--surface);border:1px dashed var(--line);border-radius:2px;
  padding:34px 20px;text-align:center;color:var(--muted)}
.empty-state p{margin:0;font-size:15px}

.section-h{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);margin:22px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.section-h:first-child{margin-top:2px}
.chiplist{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);
  border-radius:2px;padding:7px 8px 7px 11px;font-family:var(--mono);font-size:13px}
.chip button{border:0;background:none;color:var(--red);font-size:17px;line-height:1;padding:0 2px;cursor:pointer}
.note{font-size:13.5px;color:var(--muted);margin:8px 0 0}
.note code{font-family:var(--mono);font-size:12.5px;background:var(--surface);padding:1px 4px;border:1px solid var(--line-soft)}
.danger{background:none;border:1px solid var(--red);color:var(--red);width:100%;padding:14px;border-radius:2px;
  font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;margin-top:4px}
.exportbtn{width:100%;background:var(--ink);color:#fff;border:0;border-radius:2px;padding:16px;margin-bottom:9px;
  font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;text-align:left}
.exportbtn span{display:block;font-size:10px;letter-spacing:.06em;text-transform:none;opacity:.65;margin-top:3px;font-weight:400}
.exportbtn.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.exportbtn:disabled{opacity:.4}

/* ---------- Toast ---------- */
#toast{position:fixed;left:14px;right:14px;bottom:calc(88px + env(safe-area-inset-bottom));z-index:60;
  background:var(--ink);color:#fff;padding:13px 15px;border-radius:2px;border-left:4px solid var(--red);
  font-family:var(--mono);font-size:12.5px;letter-spacing:.04em;
  transform:translateY(16px);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
#toast.on{opacity:1;transform:translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="titleblock">
  <div class="tb-top">
    <span class="tb-name">Field Audit</span>
    <span class="tb-count"><b id="cCount">0</b> entries &nbsp;·&nbsp; <b id="cPhotos">0</b> photos</span>
  </div>
  <div class="tb-grid">
    <div class="tb-cell"><span class="tb-label">Building</span><span class="tb-value empty" id="tbBuilding">—</span></div>
    <div class="tb-cell"><span class="tb-label">Floor</span><span class="tb-value empty" id="tbFloor">—</span></div>
    <div class="tb-cell"><span class="tb-label">Room</span><span class="tb-value empty" id="tbRoom">—</span></div>
  </div>
</header>

<nav class="tabs" role="tablist">
  <button class="tab" id="tabCapture" role="tab" aria-selected="true" aria-controls="pCapture">Capture</button>
  <button class="tab" id="tabEntries" role="tab" aria-selected="false" aria-controls="pEntries">Entries</button>
  <button class="tab" id="tabSetup" role="tab" aria-selected="false" aria-controls="pSetup">Lists</button>
</nav>

<main>

<!-- ============ CAPTURE ============ -->
<section class="panel" id="pCapture" role="tabpanel" aria-labelledby="tabCapture">

  <div class="field">
    <label class="flabel" for="fBuilding">Building</label>
    <div class="row">
      <select class="ctl" id="fBuilding"></select>
      <button class="iconbtn" type="button" data-add="building" aria-label="Add a building">+</button>
    </div>
    <div class="addrow" hidden data-addrow="building">
      <input class="ctl" type="text" placeholder="New building" autocapitalize="characters">
      <button class="mini" type="button" data-save="building">Add</button>
      <button class="mini ghost" type="button" data-cancel="building">Cancel</button>
    </div>
  </div>

  <div class="field">
    <label class="flabel" for="fFloor">Floor</label>
    <div class="row">
      <select class="ctl" id="fFloor"></select>
      <button class="iconbtn" type="button" data-add="floor" aria-label="Add a floor">+</button>
    </div>
    <div class="addrow" hidden data-addrow="floor">
      <input class="ctl" type="text" placeholder="New floor" autocapitalize="characters">
      <button class="mini" type="button" data-save="floor">Add</button>
      <button class="mini ghost" type="button" data-cancel="floor">Cancel</button>
    </div>
  </div>

  <div class="field">
    <label class="flabel" for="fRoom">Room number</label>
    <input class="ctl" type="text" id="fRoom" placeholder="e.g. 2.14" autocapitalize="characters" enterkeyhint="next">
  </div>

  <div class="field">
    <label class="flabel" for="fAsset">Asset name / code</label>
    <div class="row">
      <select class="ctl" id="fAsset"></select>
      <button class="iconbtn" type="button" data-add="asset" aria-label="Add an asset">+</button>
    </div>
    <div class="addrow" hidden data-addrow="asset">
      <input class="ctl" type="text" placeholder="New asset name or code">
      <button class="mini" type="button" data-save="asset">Add</button>
      <button class="mini ghost" type="button" data-cancel="asset">Cancel</button>
    </div>
  </div>

  <div class="two">
    <div class="field">
      <label class="flabel" for="fType">Type / dimensions</label>
      <input class="ctl" type="text" id="fType" placeholder="e.g. 1800×600">
    </div>
    <div class="field">
      <label class="flabel" for="fQty">Quantity</label>
      <input class="ctl" type="number" id="fQty" value="1" min="1" step="1" inputmode="numeric">
    </div>
  </div>

  <div class="field">
    <label class="flabel" for="fNotes">Notes</label>
    <textarea class="ctl" id="fNotes" placeholder="Condition, defects, access issues…"></textarea>
  </div>

  <div class="field">
    <span class="flabel">Photos</span>
    <div class="photobar">
      <button class="mini" type="button" id="btnCamera">Camera</button>
      <button class="mini" type="button" id="btnGallery">Gallery</button>
    </div>
    <div class="thumbs" id="thumbs"></div>
    <input type="file" id="inCamera" accept="image/*" capture="environment" multiple hidden>
    <input type="file" id="inGallery" accept="image/*" multiple hidden>
  </div>
</section>

<!-- ============ ENTRIES ============ -->
<section class="panel" id="pEntries" role="tabpanel" aria-labelledby="tabEntries" hidden>
  <div class="section-h">Export</div>
  <button class="exportbtn" id="btnCsvZip">Export CSV + photos
    <span>One .zip — audit.csv plus every photo, filenames matched to rows</span></button>
  <button class="exportbtn alt" id="btnCsv">Export CSV only
    <span>Spreadsheet rows, no image files</span></button>
  <div class="section-h">Captured</div>
  <div id="list"></div>
</section>

<!-- ============ LISTS ============ -->
<section class="panel" id="pSetup" role="tabpanel" aria-labelledby="tabSetup" hidden>
  <div class="section-h">Buildings</div>
  <div class="chiplist" id="lsBuilding"></div>
  <div class="section-h">Floors</div>
  <div class="chiplist" id="lsFloor"></div>
  <div class="section-h">Assets</div>
  <div class="chiplist" id="lsAsset"></div>
  <p class="note">Removing an option here only takes it off the dropdown. Entries already captured keep their value.</p>
  <div class="section-h">Storage</div>
  <p class="note" id="storeNote">Checking storage…</p>
  <button class="danger" id="btnWipe">Delete all entries</button>
  <p class="note">Export first. This cannot be undone.</p>
  <div style="height:20px"></div>
</section>

</main>

<div class="savebar" id="savebar">
  <label class="keep"><input type="checkbox" id="keepRoom" checked> Keep room</label>
  <button class="save" id="btnSave">Save entry</button>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";

/* ============================================================
   Storage — IndexedDB, with an in-memory fallback so the app
   still runs (for the session) where IDB is unavailable.
   ============================================================ */
var DB_NAME='seus_field_audit', DB_VER=1, db=null, usingMemory=false;
var mem={entries:[],meta:{}};

function openDb(){
  return new Promise(function(res){
    var req;
    try{ req=indexedDB.open(DB_NAME,DB_VER); }catch(e){ usingMemory=true; return res(); }
    req.onupgradeneeded=function(){
      var d=req.result;
      if(!d.objectStoreNames.contains('entries')) d.createObjectStore('entries',{keyPath:'id'});
      if(!d.objectStoreNames.contains('meta')) d.createObjectStore('meta',{keyPath:'k'});
    };
    req.onsuccess=function(){ db=req.result; res(); };
    req.onerror=function(){ usingMemory=true; res(); };
    req.onblocked=function(){ usingMemory=true; res(); };
  });
}
function tx(store,mode){ return db.transaction(store,mode).objectStore(store); }
function idbAll(store){
  return new Promise(function(res){ var r=tx(store,'readonly').getAll(); r.onsuccess=function(){res(r.result||[])}; r.onerror=function(){res([])}; });
}
function idbPut(store,val){
  return new Promise(function(res){ var r=tx(store,'readwrite').put(val); r.onsuccess=function(){res(true)}; r.onerror=function(){res(false)}; });
}
function idbDel(store,key){
  return new Promise(function(res){ var r=tx(store,'readwrite').delete(key); r.onsuccess=function(){res(true)}; r.onerror=function(){res(false)}; });
}
function idbClear(store){
  return new Promise(function(res){ var r=tx(store,'readwrite').clear(); r.onsuccess=function(){res(true)}; r.onerror=function(){res(false)}; });
}

var store={
  allEntries:function(){ return usingMemory?Promise.resolve(mem.entries.slice()):idbAll('entries'); },
  putEntry:function(e){
    if(usingMemory){ var i=mem.entries.findIndex(function(x){return x.id===e.id}); if(i>-1)mem.entries[i]=e; else mem.entries.push(e); return Promise.resolve(true); }
    return idbPut('entries',e);
  },
  delEntry:function(id){
    if(usingMemory){ mem.entries=mem.entries.filter(function(x){return x.id!==id}); return Promise.resolve(true); }
    return idbDel('entries',id);
  },
  clearEntries:function(){ if(usingMemory){ mem.entries=[]; return Promise.resolve(true);} return idbClear('entries'); },
  getMeta:function(k){
    if(usingMemory) return Promise.resolve(mem.meta[k]);
    return new Promise(function(res){ var r=tx('meta','readonly').get(k); r.onsuccess=function(){res(r.result?r.result.v:undefined)}; r.onerror=function(){res(undefined)}; });
  },
  setMeta:function(k,v){ if(usingMemory){ mem.meta[k]=v; return Promise.resolve(true);} return idbPut('meta',{k:k,v:v}); }
};

/* ============================================================
   State
   ============================================================ */
var lists={building:[],floor:[],asset:[]};
var entries=[];        // newest first
var draftPhotos=[];    // {blob, url}
var editingId=null;
var seq=0;

var $=function(s){return document.querySelector(s)};
var $$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s))};

/* ============================================================
   Toast
   ============================================================ */
var toastEl=$('#toast'), toastT;
function toast(msg){
  toastEl.textContent=msg; toastEl.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(function(){toastEl.classList.remove('on')},2600);
}

/* ============================================================
   Tabs
   ============================================================ */
var TABS=[['#tabCapture','#pCapture'],['#tabEntries','#pEntries'],['#tabSetup','#pSetup']];
function showTab(idx){
  TABS.forEach(function(p,i){
    $(p[0]).setAttribute('aria-selected', i===idx?'true':'false');
    $(p[1]).hidden = i!==idx;
  });
  $('#savebar').style.display = idx===0?'flex':'none';
  document.body.style.paddingBottom = idx===0?'calc(84px + env(safe-area-inset-bottom))':'20px';
  window.scrollTo(0,0);
  if(idx===1) renderList();
  if(idx===2) renderLists();
}
TABS.forEach(function(p,i){ $(p[0]).addEventListener('click',function(){showTab(i)}) });

/* ============================================================
   Dropdowns
   ============================================================ */
var PLACEHOLDER={building:'No buildings yet — tap +',floor:'No floors yet — tap +',asset:'No assets yet — tap +'};
var SELECTOR={building:'#fBuilding',floor:'#fFloor',asset:'#fAsset'};

function fillSelect(kind){
  var sel=$(SELECTOR[kind]), keep=sel.value, arr=lists[kind];
  sel.innerHTML='';
  if(!arr.length){
    var o=document.createElement('option'); o.value=''; o.textContent=PLACEHOLDER[kind]; o.disabled=true; o.selected=true;
    sel.appendChild(o); return;
  }
  var blank=document.createElement('option'); blank.value=''; blank.textContent='—'; sel.appendChild(blank);
  arr.forEach(function(v){ var o=document.createElement('option'); o.value=v; o.textContent=v; sel.appendChild(o); });
  if(arr.indexOf(keep)>-1) sel.value=keep;
}
function fillAll(){ ['building','floor','asset'].forEach(fillSelect); }

$$('[data-add]').forEach(function(btn){
  btn.addEventListener('click',function(){
    var kind=btn.getAttribute('data-add');
    var row=document.querySelector('[data-addrow="'+kind+'"]');
    row.hidden=false; row.querySelector('input').focus();
  });
});
$$('[data-cancel]').forEach(function(btn){
  btn.addEventListener('click',function(){
    var kind=btn.getAttribute('data-cancel');
    var row=document.querySelector('[data-addrow="'+kind+'"]');
    row.querySelector('input').value=''; row.hidden=true;
  });
});
$$('[data-save]').forEach(function(btn){
  btn.addEventListener('click',function(){ addOption(btn.getAttribute('data-save')) });
});
$$('.addrow input').forEach(function(inp){
  inp.addEventListener('keydown',function(e){
    if(e.key==='Enter'){ e.preventDefault(); addOption(inp.closest('.addrow').getAttribute('data-addrow')); }
  });
});
function addOption(kind){
  var row=document.querySelector('[data-addrow="'+kind+'"]');
  var inp=row.querySelector('input'), val=inp.value.trim();
  if(!val){ inp.focus(); return; }
  if(lists[kind].indexOf(val)>-1){ toast(val+' is already on the list'); }
  else { lists[kind].push(val); lists[kind].sort(function(a,b){return a.localeCompare(b,undefined,{numeric:true})}); store.setMeta('lists',lists); }
  fillSelect(kind);
  $(SELECTOR[kind]).value=val;
  inp.value=''; row.hidden=true;
  syncTitleBlock();
}

/* ============================================================
   Title block
   ============================================================ */
function setTb(id,val){
  var el=$(id);
  el.textContent=val||'—';
  el.classList.toggle('empty',!val);
}
function syncTitleBlock(){
  setTb('#tbBuilding',$('#fBuilding').value);
  setTb('#tbFloor',$('#fFloor').value);
  setTb('#tbRoom',$('#fRoom').value.trim());
}
['#fBuilding','#fFloor'].forEach(function(s){ $(s).addEventListener('change',syncTitleBlock) });
$('#fRoom').addEventListener('input',syncTitleBlock);

function syncCounts(){
  $('#cCount').textContent=entries.length;
  var p=0; entries.forEach(function(e){ p+=(e.photos||[]).length });
  $('#cPhotos').textContent=p;
}

/* ============================================================
   Photos — downscale on capture so a full day fits on the phone
   ============================================================ */
var MAX_EDGE=1600, JPEG_Q=0.72;

function shrink(file){
  return new Promise(function(res){
    var url=URL.createObjectURL(file), img=new Image();
    img.onload=function(){
      var w=img.naturalWidth,h=img.naturalHeight,s=Math.min(1,MAX_EDGE/Math.max(w,h));
      var c=document.createElement('canvas');
      c.width=Math.round(w*s); c.height=Math.round(h*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      c.toBlob(function(b){ res(b||file) },'image/jpeg',JPEG_Q);
    };
    img.onerror=function(){ URL.revokeObjectURL(url); res(file) };
    img.src=url;
  });
}
function renderThumbs(){
  var box=$('#thumbs'); box.innerHTML='';
  draftPhotos.forEach(function(p,i){
    var d=document.createElement('div'); d.className='thumb';
    var im=document.createElement('img'); im.src=p.url; im.alt='Photo '+(i+1);
    var x=document.createElement('button'); x.type='button'; x.textContent='×';
    x.setAttribute('aria-label','Remove photo '+(i+1));
    x.addEventListener('click',function(){ URL.revokeObjectURL(p.url); draftPhotos.splice(i,1); renderThumbs(); });
    d.appendChild(im); d.appendChild(x); box.appendChild(d);
  });
}
function handleFiles(files){
  var list=Array.prototype.slice.call(files);
  if(!list.length) return;
  toast('Processing '+list.length+' photo'+(list.length>1?'s':'')+'…');
  Promise.all(list.map(shrink)).then(function(blobs){
    blobs.forEach(function(b){ draftPhotos.push({blob:b,url:URL.createObjectURL(b)}) });
    renderThumbs(); toast(draftPhotos.length+' photo'+(draftPhotos.length>1?'s':'')+' attached');
  });
}
$('#btnCamera').addEventListener('click',function(){ $('#inCamera').click() });
$('#btnGallery').addEventListener('click',function(){ $('#inGallery').click() });
$('#inCamera').addEventListener('change',function(e){ handleFiles(e.target.files); e.target.value=''; });
$('#inGallery').addEventListener('change',function(e){ handleFiles(e.target.files); e.target.value=''; });

/* ============================================================
   Save / edit
   ============================================================ */
function pad(n){ return String(n).padStart(4,'0') }

$('#btnSave').addEventListener('click',function(){
  var building=$('#fBuilding').value, floor=$('#fFloor').value;
  var room=$('#fRoom').value.trim(), asset=$('#fAsset').value;
  var type=$('#fType').value.trim(), notes=$('#fNotes').value.trim();
  var qty=parseInt($('#fQty').value,10); if(!qty||qty<1) qty=1;

  if(!asset && !type && !notes && !draftPhotos.length){
    toast('Add an asset, a description, a note or a photo first'); return;
  }

  var entry;
  if(editingId){
    entry=entries.filter(function(e){return e.id===editingId})[0];
    entry.building=building; entry.floor=floor; entry.room=room; entry.asset=asset;
    entry.type=type; entry.qty=qty; entry.notes=notes;
    entry.photos=draftPhotos.map(function(p){return p.blob});
    entry.updatedAt=new Date().toISOString();
  }else{
    seq++;
    entry={ id:'E'+pad(seq), seq:seq, createdAt:new Date().toISOString(),
      building:building, floor:floor, room:room, asset:asset, type:type, qty:qty, notes:notes,
      photos:draftPhotos.map(function(p){return p.blob}) };
    entries.unshift(entry);
  }

  store.putEntry(entry);
  store.setMeta('seq',seq);

  var wasEdit=!!editingId; editingId=null;
  $('#btnSave').textContent='Save entry';

  // Clear the item, keep the location if asked.
  draftPhotos.forEach(function(p){ URL.revokeObjectURL(p.url) });
  draftPhotos=[]; renderThumbs();
  $('#fAsset').value=''; $('#fType').value=''; $('#fQty').value='1'; $('#fNotes').value='';
  if(!$('#keepRoom').checked){ $('#fBuilding').value=''; $('#fFloor').value=''; $('#fRoom').value=''; }
  syncTitleBlock(); syncCounts();
  toast(wasEdit?entry.id+' updated':entry.id+' saved');
  if(wasEdit) showTab(1);
});

function editEntry(id){
  var e=entries.filter(function(x){return x.id===id})[0]; if(!e) return;
  editingId=id;
  ['building','floor','asset'].forEach(function(k){
    var v=e[k]; if(v && lists[k].indexOf(v)===-1){ lists[k].push(v); lists[k].sort(); store.setMeta('lists',lists); fillSelect(k); }
  });
  $('#fBuilding').value=e.building||''; $('#fFloor').value=e.floor||'';
  $('#fRoom').value=e.room||''; $('#fAsset').value=e.asset||'';
  $('#fType').value=e.type||''; $('#fQty').value=e.qty||1; $('#fNotes').value=e.notes||'';
  draftPhotos.forEach(function(p){ URL.revokeObjectURL(p.url) });
  draftPhotos=(e.photos||[]).map(function(b){ return {blob:b,url:URL.createObjectURL(b)} });
  renderThumbs(); syncTitleBlock();
  $('#btnSave').textContent='Update '+id;
  showTab(0);
}
function removeEntry(id){
  if(!confirm('Delete '+id+'? This cannot be undone.')) return;
  entries=entries.filter(function(e){return e.id!==id});
  store.delEntry(id); renderList(); syncCounts(); toast(id+' deleted');
}

/* ============================================================
   Entries list
   ============================================================ */
function fmtTime(iso){
  var d=new Date(iso);
  return d.toLocaleDateString('en-AU',{day:'2-digit',month:'short'})+' '+
         d.toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit',hour12:false});
}
function renderList(){
  var box=$('#list'); box.innerHTML='';
  $('#btnCsv').disabled=$('#btnCsvZip').disabled=!entries.length;
  if(!entries.length){
    box.innerHTML='<div class="empty-state"><p>Nothing captured yet. Head to Capture and log your first item.</p></div>';
    return;
  }
  entries.forEach(function(e){
    var loc=[e.building,e.floor,e.room?'Rm '+e.room:''].filter(Boolean).join('  /  ')||'No location';
    var meta=[]; if(e.qty>1) meta.push('×'+e.qty); if(e.type) meta.push(e.type);
    if((e.photos||[]).length) meta.push(e.photos.length+' photo'+(e.photos.length>1?'s':''));
    var c=document.createElement('div'); c.className='card';
    c.innerHTML=
      '<div class="card-top"><span class="card-id"></span><span class="card-time"></span></div>'+
      '<div class="card-loc"></div><div class="card-asset"></div>'+
      '<div class="card-meta"></div><div class="card-notes"></div>'+
      '<div class="card-acts"><button class="mini ghost" type="button">Edit</button>'+
      '<button class="mini ghost" type="button">Delete</button></div>';
    c.querySelector('.card-id').textContent=e.id;
    c.querySelector('.card-time').textContent=fmtTime(e.createdAt);
    c.querySelector('.card-loc').textContent=loc;
    c.querySelector('.card-asset').textContent=e.asset||'(unnamed item)';
    c.querySelector('.card-meta').textContent=meta.join('  ·  ');
    c.querySelector('.card-notes').textContent=e.notes||'';
    var b=c.querySelectorAll('.card-acts button');
    b[0].addEventListener('click',function(){editEntry(e.id)});
    b[1].addEventListener('click',function(){removeEntry(e.id)});
    box.appendChild(c);
  });
}

/* ============================================================
   Lists tab
   ============================================================ */
function renderLists(){
  [['building','#lsBuilding'],['floor','#lsFloor'],['asset','#lsAsset']].forEach(function(p){
    var box=$(p[1]); box.innerHTML='';
    if(!lists[p[0]].length){
      var s=document.createElement('span'); s.className='note';
      s.textContent='Empty. Add options from the Capture tab.'; box.appendChild(s); return;
    }
    lists[p[0]].forEach(function(v){
      var chip=document.createElement('span'); chip.className='chip';
      var t=document.createElement('span'); t.textContent=v;
      var x=document.createElement('button'); x.type='button'; x.textContent='×';
      x.setAttribute('aria-label','Remove '+v);
      x.addEventListener('click',function(){
        lists[p[0]]=lists[p[0]].filter(function(y){return y!==v});
        store.setMeta('lists',lists); fillSelect(p[0]); renderLists();
      });
      chip.appendChild(t); chip.appendChild(x); box.appendChild(chip);
    });
  });
}
$('#btnWipe').addEventListener('click',function(){
  if(!entries.length){ toast('Nothing to delete'); return; }
  if(!confirm('Delete all '+entries.length+' entries and their photos?')) return;
  if(!confirm('Last check — export first if you have not. Delete everything?')) return;
  entries=[]; seq=0; store.clearEntries(); store.setMeta('seq',0);
  renderList(); syncCounts(); toast('All entries deleted');
});

/* ============================================================
   Export
   ============================================================ */
var COLS=['entry_id','captured_at','building','floor','room','asset_name','type_dimensions','quantity','notes','photo_count','photo_files'];

function csvCell(v){ return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'; }
function photoNames(e){ return (e.photos||[]).map(function(_,i){ return e.id+'_'+(i+1)+'.jpg' }); }

/* Local wall-clock time, ISO-shaped so it sorts as text and never
   reads as an American date once it lands in a spreadsheet. */
function csvTime(iso){
  var d=new Date(iso), p=function(n){return String(n).padStart(2,'0')};
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+
         p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
}
function buildCsv(){
  var rows=[COLS.map(csvCell).join(',')];
  entries.slice().sort(function(a,b){return a.seq-b.seq}).forEach(function(e){
    rows.push([ e.id, csvTime(e.createdAt),
      e.building||'', e.floor||'', e.room||'', e.asset||'', e.type||'', e.qty||1,
      e.notes||'', (e.photos||[]).length, photoNames(e).join('; ')
    ].map(csvCell).join(','));
  });
  return '\uFEFF'+rows.join('\r\n')+'\r\n';
}

function stamp(){
  var d=new Date(), p=function(n){return String(n).padStart(2,'0')};
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes());
}
function download(blob,name){
  var url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url) },1500);
}

$('#btnCsv').addEventListener('click',function(){
  if(!entries.length) return;
  download(new Blob([buildCsv()],{type:'text/csv;charset=utf-8'}),'audit_'+stamp()+'.csv');
  toast('CSV exported');
});

/* --- Minimal store-only ZIP writer (no library, works offline) --- */
var CRC_TABLE=(function(){
  var t=new Uint32Array(256);
  for(var n=0;n<256;n++){ var c=n; for(var k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); t[n]=c>>>0; }
  return t;
})();
function crc32(u8){
  var c=0xFFFFFFFF;
  for(var i=0;i<u8.length;i++) c=CRC_TABLE[(c^u8[i])&0xFF]^(c>>>8);
  return (c^0xFFFFFFFF)>>>0;
}
function makeZip(files){
  var enc=new TextEncoder(), parts=[], central=[], offset=0;
  files.forEach(function(f){
    var nb=enc.encode(f.name), crc=crc32(f.data), len=f.data.length;
    var lh=new Uint8Array(30+nb.length), lv=new DataView(lh.buffer);
    lv.setUint32(0,0x04034b50,true); lv.setUint16(4,20,true); lv.setUint16(6,0,true);
    lv.setUint16(8,0,true); lv.setUint16(10,0,true); lv.setUint16(12,0,true);
    lv.setUint32(14,crc,true); lv.setUint32(18,len,true); lv.setUint32(22,len,true);
    lv.setUint16(26,nb.length,true); lv.setUint16(28,0,true);
    lh.set(nb,30); parts.push(lh,f.data);
    var cd=new Uint8Array(46+nb.length), cv=new DataView(cd.buffer);
    cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true);
    cv.setUint16(8,0,true); cv.setUint16(10,0,true); cv.setUint16(12,0,true); cv.setUint16(14,0,true);
    cv.setUint32(16,crc,true); cv.setUint32(20,len,true); cv.setUint32(24,len,true);
    cv.setUint16(28,nb.length,true); cv.setUint32(38,0,true); cv.setUint32(42,offset,true);
    cd.set(nb,46); central.push(cd);
    offset+=lh.length+len;
  });
  var cdSize=central.reduce(function(a,c){return a+c.length},0);
  var end=new Uint8Array(22), ev=new DataView(end.buffer);
  ev.setUint32(0,0x06054b50,true); ev.setUint16(8,central.length,true);
  ev.setUint16(10,central.length,true); ev.setUint32(12,cdSize,true); ev.setUint32(16,offset,true);
  return new Blob(parts.concat(central,[end]),{type:'application/zip'});
}

$('#btnCsvZip').addEventListener('click',function(){
  if(!entries.length) return;
  var btn=this; btn.disabled=true; toast('Packing photos…');
  var files=[{name:'audit.csv',data:new TextEncoder().encode(buildCsv())}];
  var jobs=[];
  entries.slice().sort(function(a,b){return a.seq-b.seq}).forEach(function(e){
    var names=photoNames(e);
    (e.photos||[]).forEach(function(b,i){
      jobs.push(b.arrayBuffer().then(function(ab){
        files.push({name:'photos/'+names[i],data:new Uint8Array(ab)});
      }));
    });
  });
  Promise.all(jobs).then(function(){
    download(makeZip(files),'audit_'+stamp()+'.zip');
    btn.disabled=false; toast('CSV + photos exported');
  }).catch(function(){ btn.disabled=false; toast('Export failed — try CSV only'); });
});

/* ============================================================
   Boot
   ============================================================ */
openDb().then(function(){
  return Promise.all([store.getMeta('lists'),store.getMeta('seq'),store.allEntries()]);
}).then(function(r){
  if(r[0]) lists=Object.assign({building:[],floor:[],asset:[]},r[0]);
  seq=r[1]||0;
  entries=(r[2]||[]).sort(function(a,b){return b.seq-a.seq});
  if(!seq && entries.length) seq=entries[0].seq||entries.length;
  fillAll(); syncTitleBlock(); syncCounts(); renderList(); renderLists(); showTab(0);

  var note=$('#storeNote');
  if(usingMemory){
    note.innerHTML='<b>Warning — this session only.</b> The browser is not allowing local storage, so entries will be lost on refresh. Open the app from a hosted link rather than a downloaded file.';
    toast('Storage unavailable — export before closing');
  }else if(navigator.storage && navigator.storage.persist){
    navigator.storage.persist().then(function(ok){
      note.textContent = ok
        ? 'Entries are saved on this phone and marked as persistent. Nothing is sent anywhere.'
        : 'Entries are saved on this phone. Nothing is sent anywhere. Export at the end of each day so a browser storage clean-up cannot cost you a day of work.';
    });
  }else{
    note.textContent='Entries are saved on this phone. Nothing is sent anywhere.';
  }
});

if('serviceWorker' in navigator){
  window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
})();
